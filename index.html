<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expo Promo — Oxbridge + Ghazali</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  video{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
  #snd{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:5;
       background:#0B5D43;color:#fff;border:2px solid #C9A227;border-radius:999px;
       font-size:22px;font-family:Arial,sans-serif;padding:14px 34px;cursor:pointer}
</style></head><body>
<video id="v" src="video.mp4" autoplay loop muted playsinline controls></video>
<button id="snd">🔊 Sound On</button>
<script>
  var v=document.getElementById('v'), b=document.getElementById('snd');
  b.onclick=function(){ v.muted=false; v.volume=1; v.play(); b.style.display='none'; };
  v.addEventListener('play',function(){ if(!v.muted) b.style.display='none'; });
</script></body></html>
